services:
  postgres:
    image: postgres:15-alpine
    container_name: civicsol_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: civicsol
      POSTGRES_USER: civicsol_user
      POSTGRES_PASSWORD: civicsol_pass

    ports:
      - "5432:5432"

    volumes:
      - civicsol_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U civicsol_user -d civicsol"
        ]
      interval: 5s
      timeout: 5s
      retries: 5


  redis:
    image: redis:7-alpine
    container_name: civicsol_redis
    restart: unless-stopped

    ports:
      - "6379:6379"


volumes:
  civicsol_postgres_data: